<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>𓆩villain host𓆪 Download</title>
  <style>
    body {
      background-color: #000;
      color: #fff;
      font-family: monospace;
      text-align: center;
      padding: 50px;
    }
    h1 {
      font-size: 28px;
      text-shadow: 0 0 10px red, 0 0 20px red;
      margin-bottom: 40px;
    }
    input, select {
      width: 80%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid red;
      background: black;
      color: white;
      box-shadow: 0 0 8px red;
      margin-bottom: 20px;
    }
    .btn {
      padding: 12px 30px;
      background: black;
      color: white;
      border: 2px solid red;
      border-radius: 25px;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 0 15px red;
    }
    .btn:hover {
      background: red;
      color: black;
    }
    #result {
      margin-top: 30px;
    }
    a {
      color: #ff4444;
    }
  </style>
</head>
<body>
  <h1>SELAMAT DATANG DI 𓆩villain host𓆪 DOWNLOAD</h1>
  <input type="text" id="url" placeholder="Tempel link TikTok pendek di sini" />
  <br>
  <select id="format">
    <option value="mp4">Download MP4 (Video)</option>
    <option value="mp3">Download MP3 (Audio)</option>
  </select>
  <br>
  <button class="btn" onclick="getDownload()">DOWNLOAD</button>
  <div id="result"></div>

  <script>
    async function getDownload() {
      const url = document.getElementById('url').value;
      const format = document.getElementById('format').value;
      const result = document.getElementById('result');
      result.innerHTML = 'Memproses...';

      try {
        const res = await fetch(`/api/tiktok?url=${encodeURIComponent(url)}`);
        const data = await res.json();

        if (data.error) {
          result.innerHTML = 'Gagal mengambil data video.';
          return;
        }

        if (format === 'mp4') {
          result.innerHTML = `<p>Video:</p><a href="${data.video}" target="_blank">Download MP4</a>`;
        } else {
          result.innerHTML = `<p>Audio:</p><a href="${data.audio}" target="_blank">Download MP3</a>`;
        }
      } catch (err) {
        result.innerHTML = 'Terjadi kesalahan saat mengambil data.';
      }
    }
  </script>
</body>
</html>
