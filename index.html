<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>𓆩villain host𓆪 Downloader</title>
  <style>
    body {
      background-color: #1a0000;
      color: #ff4d4d;
      font-family: 'Courier New', monospace;
      text-align: center;
      padding: 40px;
    }
    input, button {
      padding: 12px;
      margin: 10px;
      border: 2px solid #ff4d4d;
      background: black;
      color: #ff4d4d;
      border-radius: 8px;
      width: 80%;
    }
    button {
      cursor: pointer;
      font-weight: bold;
    }
    .glow {
      border: 2px solid #ff4d4d;
      box-shadow: 0 0 15px #ff4d4d;
      padding: 15px;
      border-radius: 10px;
      margin-top: 20px;
    }
    a {
      color: #ffcccc;
      display: block;
      margin: 10px;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>Selamat datang di 𓆩villain host𓆪 download</h1>
  <input type="text" id="tiktokUrl" placeholder="Tempel link TikTok di sini" />
  <button onclick="download()">Download</button>

  <div class="glow" id="result"></div>

  <script>
    async function download() {
      const url = document.getElementById('tiktokUrl').value;
      if (!url) return alert("Masukkan link terlebih dahulu.");

      const res = await fetch(`/api/tiktok?url=${encodeURIComponent(url)}`);
      const data = await res.json();

      const result = document.getElementById('result');
      if (data.error) {
        result.innerHTML = "Gagal mengambil video.";
      } else {
        result.innerHTML = `
          <a href="${data.video}" target="_blank">Download Video (MP4)</a>
          <a href="${data.audio}" target="_blank">Download Audio (MP3)</a>
        `;
      }
    }
  </script>
</body>
</html>
