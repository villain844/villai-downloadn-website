<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>𓆩villain host𓆪 Download</title>
  <style>
    body {
      background-color: #000;
      color: #fff;
      font-family: monospace;
      text-align: center;
      padding: 50px;
    }

    h1 {
      font-size: 28px;
      text-shadow: 0 0 10px red, 0 0 20px red;
      margin-bottom: 40px;
    }

    input[type="text"] {
      width: 80%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid red;
      background: black;
      color: white;
      box-shadow: 0 0 8px red;
      margin-bottom: 20px;
    }

    .btn {
      padding: 12px 30px;
      background: black;
      color: white;
      border: 2px solid red;
      border-radius: 25px;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 0 15px red;
    }

    .btn:hover {
      background: red;
      color: black;
    }

    #result {
      margin-top: 30px;
    }

    a {
      color: #ff4444;
    }
  </style>
</head>
<body>
  <h1>SELAMAT DATANG DI 𓆩villain host𓆪 DOWNLOAD</h1>
  <input type="text" id="url" placeholder="Tempel link TikTok di sini" />
  <br>
  <button class="btn" onclick="download()">DOWNLOAD</button>
  <div id="result"></div>

  <script>
    async function download() {
      const url = document.getElementById('url').value;
      const result = document.getElementById('result');
      result.innerHTML = "Memproses...";

      try {
        const response = await fetch(`/api/tikmate?url=${encodeURIComponent(url)}`);
        const data = await response.json();

        if (data?.token && data?.id) {
          const videoUrl = `https://tikmate.app/download/${data.token}/${data.id}.mp4`;
          result.innerHTML = `<p>Link Video:</p><a href="${videoUrl}" target="_blank">${videoUrl}</a>`;
        } else {
          result.innerHTML = "Gagal mendapatkan link video.";
        }
      } catch (error) {
        result.innerHTML = "Terjadi kesalahan saat mengambil data.";
      }
    }
  </script>
</body>
</html>
