<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>𓆩villain host𓆪 Download</title>
  <style>
    body {
      background-color: #000;
      color: #fff;
      font-family: monospace;
      text-align: center;
      padding: 50px;
    }

    h1 {
      font-size: 28px;
      text-shadow: 0 0 10px red, 0 0 20px red;
      margin-bottom: 40px;
    }

    input[type="text"], select {
      width: 80%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid red;
      background: black;
      color: white;
      box-shadow: 0 0 8px red;
      margin-bottom: 20px;
    }

    .btn {
      padding: 12px 30px;
      background: black;
      color: white;
      border: 2px solid red;
      border-radius: 25px;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 0 15px red;
    }

    .btn:hover {
      background: red;
      color: black;
    }

    #result {
      margin-top: 30px;
    }

    a {
      color: #ff4444;
    }
  </style>
</head>
<body>
  <h1>SELAMAT DATANG DI 𓆩villain host𓆪 DOWNLOAD</h1>
  <input type="text" id="url" placeholder="Tempel link TikTok pendek di sini" />
  <br>
  <select id="format">
    <option value="mp4">Download MP4 (Video)</option>
    <option value="mp3">Download MP3 (Audio)</option>
  </select>
  <br>
  <button class="btn" onclick="resolveAndDownload()">DOWNLOAD</button>
  <div id="result"></div>

  <script>
    async function resolveAndDownload() {
      const inputUrl = document.getElementById('url').value;
      const format = document.getElementById('format').value;
      const result = document.getElementById('result');
      result.innerHTML = "Mengekstrak link...";

      try {
        // Step 1: Resolve short TikTok URL
        const res = await fetch(inputUrl, { method: 'HEAD', redirect: 'follow' });
        const fullUrl = res.url;

        // Step 2: Call TiklyDown API
        result.innerHTML = "Mengambil video...";
        const apiRes = await fetch(`https://api.tiklydown.me/download?url=${encodeURIComponent(fullUrl)}`);
        const data = await apiRes.json();

        if (!data || !data.video) {
          result.innerHTML = "Gagal mendapatkan data video.";
          return;
        }

        if (format === "mp4" && data.video.no_watermark) {
          result.innerHTML = `<p>Video:</p><a href="${data.video.no_watermark}" target="_blank">Download MP4 (Tanpa Watermark)</a>`;
        } else if (format === "mp3" && data.music && data.music.play_url) {
          result.innerHTML = `<p>Audio:</p><a href="${data.music.play_url}" target="_blank">Download MP3</a>`;
        } else {
          result.innerHTML = "Format tidak tersedia untuk video ini.";
        }

      } catch (error) {
        result.innerHTML = "Terjadi kesalahan saat mengambil data.";
      }
    }
  </script>
</body>
</html>
